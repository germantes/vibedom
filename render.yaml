services:
  - type: web
    name: vibedom
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SCAN_RATE_LIMIT
        value: "5"
      # Vertex factura por proyecto y tiene cuotas mucho más altas que la capa
      # gratuita, así que basta con espaciar 2 s y esperar hasta 12 s en cola.
      - key: GEMINI_MIN_INTERVAL_MS
        value: "2000"
      - key: GEMINI_MAX_WAIT_MS
        value: "12000"
      # Tope diario de escaneos facturables. Al agotarse, la demo responde con
      # la semilla local sin llamar a la IA. `0` lo desactiva.
      - key: SCAN_DAILY_LIMIT
        value: "200"
      - key: SCAN_IP_DAILY_LIMIT
        value: "30"
      - key: GEMINI_QUEUE_LIMIT
        value: "10"
      # Cuando la cuota se agota, la demo sigue sonando con una semilla local
      # determinista en vez de quedarse bloqueada durante horas.
      - key: SCAN_FALLBACK
        value: "1"
      - key: SCAN_FALLBACK_COOLDOWN_S
        value: "0"
      # Vertex AI se factura contra el proyecto de Google Cloud, así que los
      # créditos se aplican desde la primera llamada (la API key puede quedarse
      # en nivel gratuito). Si VERTEX_PROJECT_ID está definido, tiene prioridad.
      - key: VERTEX_PROJECT_ID
        sync: false
      - key: VERTEX_LOCATION
        value: global
      - key: VERTEX_MODELS
        value: gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.6-flash
      # JSON de la service account en base64. Secreto: nunca en el repo.
      - key: VERTEX_SA_KEY_B64
        sync: false
      # Alternativa con API key de AI Studio; se pide al crear el servicio.
      - key: GEMINI_KEY
        sync: false
