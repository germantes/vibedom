services:
  - type: web
    name: vibedom
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SCAN_RATE_LIMIT
        value: "5"
      # La cuota de Gemini es por proyecto, no por IP. Estas llamadas se
      # serializan y se espacian 8 s (≈7,5/min) para no agotarla entre visitantes.
      - key: GEMINI_MIN_INTERVAL_MS
        value: "8000"
      - key: GEMINI_MAX_WAIT_MS
        value: "25000"
      - key: GEMINI_QUEUE_LIMIT
        value: "10"
      # Cuando la cuota se agota, la demo sigue sonando con una semilla local
      # determinista en vez de quedarse bloqueada durante horas.
      - key: SCAN_FALLBACK
        value: "1"
      - key: SCAN_FALLBACK_COOLDOWN_S
        value: "0"
      # Se pide al crear el servicio desde el Blueprint; nunca se guarda en el repo.
      - key: GEMINI_KEY
        sync: false
