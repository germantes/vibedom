name: tests

# Los tests unitarios son la primera red de seguridad del motor, la API y
# las páginas estáticas (aquí no hay bundler ni tipos). El job `e2e` añade
# navegador real (Chromium) contra el backend propio en localhost.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # El paquete raíz no tiene dependencias npm: `npm test` basta.
      - name: Tests unitarios
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Playwright vive aislado en e2e/package.json: el paquete raíz sigue
      # sin dependencias.
      - name: Instalar Playwright
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # El propio Playwright arranca `node src/backend/server.js` (raíz del
      # repo) y espera /api/ping antes de soltar los specs. No hacen falta
      # claves: ninguna prueba ejecuta un escaneo con IA.
      - name: Tests E2E
        run: npm test

      - name: Informe HTML si fallan
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
